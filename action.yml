name: 'Unity - Activate'
author: Webber Takken <webber@takken.io>
description: 'Activate Unity using credentials or a license file. Both personal and professional licenses are supported.'
inputs:
  unityVersion:
    required: false
    default: '2019.2.11f1'
    description: >-
      Unused: kept for backward compatibility with existing workflows. The
      underlying game-ci CLI detects the Unity version from the checked-out
      project itself (ProjectSettings/ProjectVersion.txt).
  cliVersion:
    required: false
    default: 'latest'
    description: >-
      Release tag of the game-ci/cli binary to install and run (e.g.
      "v0.1.0"). Defaults to the latest release; pin this for reproducible
      builds.
outputs: {}
branding:
  icon: 'box'
  color: 'gray-dark'
runs:
  using: 'node20'
  main: 'dist/index.js'
